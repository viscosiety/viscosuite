instance.name=viscolink
configurations.directory.autoLoad=false
configurations.names=viscolink,hl7v2-to-fhir
classloader.type=ScanningDirectoryClassLoader
configurations.hl7v2-to-fhir.classLoaderType=DirectoryClassLoader

manageDatabase.webServiceListener.active=true
wsdl.caching=false

warnings.suppress.sqlInjections.ManageDatabase=true
manageDatabase.active = false
jdbc.migrator.active=true

NotificationProcessorApi.active=false

# MLLP inbound listener identity — used in MSH.3 / MSH.4 of outbound ACK messages
mllp.inbound.sendingApplication=viscolink
mllp.inbound.sendingFacility=viscosiety

# Target FHIR version for the HL7v2-to-FHIR conversion pipeline.
# Determines which XSLT subfolder (xslt/<version>/) and XSD subfolder (xsd/<version>/)
# are used. Supported values: r4
fhir.target.version=r4

# viscostore FHIR base URL — transaction bundles are POSTed here
viscostore.fhir.base.url=http://localhost:8080/viscostore/fhir

# Fallback NamingSystem base URL for MR identifiers whose assigning authority (CX.4)
# carries only a text name (HD.1) rather than an OID (HD.2).
# Must end with a trailing slash.
mr.system.base=https://example.nl/fhir/NamingSystem/

# Ladybug JDBC datasource — name must match the entry in resources.yml
ladybug.jdbc.datasource=jdbc/ladybug
ladybug.jdbc.migrator.active=true

ibistesttool.custom=Custom
# Useful to prevent large messages from being truncated in Ladybug but can give Java heap space errors
# ibistesttool.maxMemoryUsage=1000000000
# ibistesttool.maxFileSize=10MB
# ibistesttool.maxMessageLength=10000000
customViews.names=viscoStore
customViews.viscoStore.name=ViscoStore

customViews.viscoStore.url=http://localhost:8180/viscostore/tester/
# Enable this setting as soon as F!F feature for relative links is merged
#customViews.viscoStore.url=/viscostore/tester/
