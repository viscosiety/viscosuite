# DeploymentSpecifics.properties
# Loaded after AppConstants.properties. Use this file for environment-specific overrides
# that differ from the defaults shipped with Frank!Framework.
#
# In Docker/production, override individual properties via environment variables or
# Kubernetes secrets mounted at /opt/frank/secrets/credentials.properties.

# Instance name shown in the Frank!Console
instance.name=ViscoLink

# FHIR base URL of ViscoStore — override per environment
viscostore.base.url=http://localhost:8080/viscostore/fhir
