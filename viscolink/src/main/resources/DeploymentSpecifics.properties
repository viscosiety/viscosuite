instance.name=viscolink
classloader.type=ScanningDirectoryClassLoader

manageDatabase.webServiceListener.active=true
wsdl.caching=false

warnings.suppress.sqlInjections.ManageDatabase=true
manageDatabase.active = false
jdbc.migrator.active=true

NotificationProcessorApi.active=false

# RabbitMQ defaults — overridden by RABBITMQ_* env vars in demo overlay.
# Placeholder so resources.yml resolves even when no RabbitMQ is running.
RABBITMQ_HOST=localhost
RABBITMQ_USERNAME=guest
RABBITMQ_PASSWORD=guest

# We need to set this explicitly, otherwise setting instance name will determine it and cause startup errors
jdbc.datasource.default=jdbc/viscolink

# Ladybug JDBC datasource name must match the entry in resources.yml
# CAUTION: when Ladybug shares the business datasource, its report insert joins the
# receiver's transaction — a FAILED transacted message rolls its report back with it,
# and that message's journey is lost. Point this at a dedicated datasource (see the
# jdbc/ladybug resource in viscorunner/conf) to keep journeys of failed messages.
ladybug.jdbc.datasource=jdbc/viscolink
ladybug.jdbc.migrator.active=true

ibistesttool.custom=Visco
# Useful to prevent large messages from being truncated in Ladybug but can give Java heap space errors
# ibistesttool.maxMemoryUsage=1000000000
# ibistesttool.maxFileSize=10MB
# ibistesttool.maxMessageLength=10000000
# A pack appends its own console views through pack.customViews.names (see the design's §10 spike
# result). Deployers that set customViews.names themselves (compose, the portal) bypass this.
customViews.names=viscoLink,${pack.customViews.names:-}
customViews.viscoLink.name=ViscoLink
customViews.viscoLink.url=/viscolink/
customViews.viscoLink.target=_self

viscolink.views.names=viscoflow
viscolink.views.viscoflow.name=ViscoFlow
viscolink.views.viscoflow.url=/viscolink/flow/
viscolink.views.viscoflow.description=Message flow viewer
