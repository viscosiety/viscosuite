instance.name=viscolink
classloader.type=ScanningDirectoryClassLoader

manageDatabase.webServiceListener.active=true
wsdl.caching=false

warnings.suppress.sqlInjections.ManageDatabase=true
manageDatabase.active = false
jdbc.migrator.active=true

NotificationProcessorApi.active=false

# RabbitMQ defaults — overridden by RABBITMQ_* env vars in demo overlay.
# Placeholder so resources.yml resolves even when no RabbitMQ is running.
RABBITMQ_HOST=localhost
RABBITMQ_USERNAME=guest
RABBITMQ_PASSWORD=guest

# We need to set this explicitly, otherwise setting instance name will determine it and cause startup errors
jdbc.datasource.default=jdbc/viscolink

# Ladybug JDBC datasource name must match the entry in resources.yml
# CAUTION: when Ladybug shares the business datasource, its report insert joins the
# receiver's transaction — a FAILED transacted message rolls its report back with it,
# and that message's journey is lost. Point this at a dedicated datasource (see the
# jdbc/ladybug resource in viscorunner/conf) to keep journeys of failed messages.
ladybug.jdbc.datasource=jdbc/viscolink
ladybug.jdbc.migrator.active=true

ibistesttool.custom=Visco
# Useful to prevent large messages from being truncated in Ladybug but can give Java heap space errors
# ibistesttool.maxMemoryUsage=1000000000
# ibistesttool.maxFileSize=10MB
# ibistesttool.maxMessageLength=10000000
# A pack appends its own console views through pack.customViews.names (see the design's §10 spike
# result). Deployers that set customViews.names themselves (compose, the portal) bypass this.
customViews.names=viscoLink,${pack.customViews.names:-}
customViews.viscoLink.name=ViscoLink
customViews.viscoLink.url=/runtime/
customViews.viscoLink.target=_self

viscolink.views.names=viscoflow
viscolink.views.viscoflow.name=ViscoFlow
viscolink.views.viscoflow.url=/runtime/flow/
viscolink.views.viscoflow.description=Message flow viewer

# A LocalFileSystem confines all file access to its configured root; an absolute filename, or one
# containing .., that resolves outside the root is refused (frankframework/frankframework#12074,
# ViscoLink's org.frankframework.filesystem.LocalFileSystem override, whose banner has the detail).
#
# LOAD-BEARING, do not drop this line with the thought that false is already the default.
# ADDITIONAL.PROPERTIES.FILE in the framework's AppConstants.properties loads THIS file AFTER
# AppConstants.properties and overrides it. Today the framework ships no such property, so the
# override's Java field default (false) applies and this line only states it. But the F!F release
# that carries PR #12075 WILL ship application.security.filesystem.allowPathsOutsideRoot=true in
# AppConstants.properties for backwards compatibility, and that would silently flip ViscoLink to
# permissive. This line is what prevents that regression.
#
# A -D system property still wins: PropertyLoader.getResolvedProperty checks system properties
# before the properties files. That is the deliberate escape hatch for a deployment that genuinely
# needs a LocalFileSystem to reach outside its root, not a hole to close.
application.security.filesystem.allowPathsOutsideRoot=false

# The Frank!Framework ships browseJdbcTable.permission.rules=* * allow, which lets the console's
# Browse JDBC Table page read ANY table on EVERY configured datasource. Blank is a deliberate
# deny-all: BrowseJdbcTable.readAllowed short-circuits on a blank value ("No JDBC table permissions
# are defined, default deny") before it parses a single rule, so it does not depend on the rule
# parser agreeing with us -- which an explicit "* * deny" rule would.
#
# Same mechanism as the line above: ADDITIONAL.PROPERTIES.FILE loads this file AFTER
# AppConstants.properties and overrides it, and BrowseJdbcTable reads the value into a
# private static final field at class init, so it must be set by the time the class first loads.
#
# The endpoint is @RolesAllowed({"IbisDataAdmin", "IbisAdmin", "IbisTester"}), so IbisObserver never
# reached it. But oauth-role-mapping.properties maps all four Ibis roles to SCOPE_openid, so on a
# runtime using the OAUTH2 authenticator every authenticated user holds IbisDataAdmin and that role
# gate filters nobody. Nothing in ViscoSuite drives this endpoint, so denying it costs us nothing:
# the console page still renders and a query answers "Access to table [...] not allowed".
browseJdbcTable.permission.rules=
