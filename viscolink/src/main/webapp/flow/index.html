<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ViscoFlow — ViscoLink</title>
<link rel="stylesheet" href="/viscolink.css">
<link rel="stylesheet" href="flow.css">
<style>
#left { width: 33.333%; }
#extension-badge { font-size: 10px; font-weight: 600; letter-spacing: .4px; padding: 2px 7px; border-radius: 10px; background: rgba(255,255,255,.12); color: rgba(255,255,255,.75); border: 1px solid rgba(255,255,255,.2); }
.td-action { width: var(--action-w, 92px); white-space: nowrap; text-align: center; padding: 0 6px; }
.row-actions { display: flex; align-items: center; justify-content: center; gap: 3px; opacity: 0; transition: opacity .1s; }
tbody tr:hover .row-actions, tbody tr.selected .row-actions { opacity: 1; }
.action-btn {
  width: 22px; height: 22px; padding: 0; border-radius: 4px; cursor: pointer;
  border: 1px solid #0d676e; background: transparent; color: #0F8A96;
  font-size: 12px; line-height: 1; display: inline-flex; align-items: center; justify-content: center;
  transition: background .1s, color .1s, border-color .1s; flex-shrink: 0;
}
.action-btn:hover:not(:disabled) { background: #0d676e; color: #fff; }
.action-btn:disabled { cursor: default; opacity: .5; }
.rerun-btn.rerun-ok  { color: #15803d; border-color: #16a34a; background: #dcfce7; }
.rerun-btn.rerun-err { color: #b91c1c; border-color: #dc2626; background: #fdecea; }
.toast {
  position: fixed; bottom: 20px; left: 50%; z-index: 9999; pointer-events: none;
  transform: translateX(-50%) translateY(12px); opacity: 0;
  transition: opacity .18s, transform .18s;
  padding: 8px 16px; border-radius: 6px; font-size: 12px; font-weight: 500;
  white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.toast-error { background: #c0392b; color: #fff; }
.toast.toast-info  { background: #0a4f54; color: #F3F5F6; }
.replay-banner { margin-top: 8px; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 4px; background: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
.fwd-stub { background: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
.stub-badge { display: inline-block; margin-left: 4px; font-size: 9px; font-weight: 700; letter-spacing: .3px; padding: 1px 4px; border-radius: 3px; vertical-align: middle; background: #fef9c3; color: #854d0e; border: 1px solid #fde047; }
.origin-tag { display: inline-block; margin-left: 7px; font-size: 9px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; padding: 1px 5px; border-radius: 8px; vertical-align: middle; background: #fff7ed; color: #b45309; border: 1px solid #fed7aa; }
.stubbed-banner { margin-top: 6px; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 4px; background: #ecfeff; color: #155e75; border: 1px solid #a5f3fc; }
.pipe-stub-badge { display: inline-block; margin-left: 6px; font-size: 9px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; padding: 1px 5px; border-radius: 3px; vertical-align: middle; background: #ecfeff; color: #155e75; border: 1px solid #a5f3fc; }
.pipe-row.stubbed-row { background: #f0fdff; }
</style>
</head>
<body>

<div id="topbar">
  <a id="back-btn" href="../">← ViscoLink</a>
  <h1>◈ ViscoFlow</h1>
  <div id="live-badge"><span class="dot" id="dot"></span><span id="live-txt">Live</span></div>
  <span id="countdown"></span>
  <select id="flow-filter"><option value="">All flows</option></select>
  <input id="patient-filter" placeholder="Patient ID…" style="width:120px">
  <span class="spacer"></span>
  <span id="extension-badge"></span>
  <span id="trace-count"></span>
</div>

<div id="main">
  <div id="left">
    <div id="table-wrap">
      <table>
        <thead><tr>
          <th class="td-status"></th>
          <th class="td-name">Flow / Pipeline</th>
          <th class="td-patient">Patient</th>
          <th class="td-time">Received At</th>
          <th class="td-dur">ms</th>
          <th class="td-action"></th>
        </tr></thead>
        <tbody id="trace-body"></tbody>
      </table>
    </div>
  </div>
  <div id="divider"></div>
  <div id="right">
    <div id="empty-state">Select a trace to view its pipeline flow</div>
    <div id="detail" style="display:none">
      <div id="trace-header"></div>
      <div id="pipeline-tree"></div>
    </div>
  </div>
</div>

<div id="toast"></div>
<script src="extensions.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
