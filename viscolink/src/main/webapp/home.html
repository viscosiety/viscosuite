<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ViscoLink</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --teal: #0B707A; --teal-light: #e3f4f6; --teal-mid: #a8d8dd;
  --teal-dark: #063B3E;
  --border: #C9D1D3; --text: #1F2A2C; --muted: #5a8a90;
  --font: system-ui, -apple-system, sans-serif;
}
html, body { height: 100%; font-family: var(--font); font-size: 14px; color: var(--text); background: #FAFBFB; }

header {
  background: var(--teal-dark); color: #F3F5F6;
  padding: 0 32px; height: 52px;
  display: flex; align-items: center; gap: 10px;
}
header h1 { font-size: 16px; font-weight: 600; letter-spacing: .3px; }
header .sub { font-size: 12px; color: rgba(255,255,255,.6); }
#back-btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 10px; border-radius: 5px;
  background: rgba(255,255,255,.10); color: rgba(255,255,255,.80);
  text-decoration: none; font-size: 12px; font-weight: 500;
  transition: background .12s, color .12s;
}
#back-btn:hover { background: rgba(255,255,255,.20); color: #fff; }

main { max-width: 680px; margin: 48px auto; padding: 0 24px; }

.section-title {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .6px; color: var(--muted); margin-bottom: 10px;
}

.tool-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 40px; }

.tool-card {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px; background: #fff;
  border: 1px solid var(--border); border-radius: 8px;
  text-decoration: none; color: inherit;
  transition: border-color .15s, box-shadow .15s;
}
.tool-card:hover { border-color: var(--teal-mid); box-shadow: 0 1px 4px rgba(0,0,0,.06); }

.tool-icon {
  width: 36px; height: 36px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.icon-teal   { background: var(--teal-light); }
.icon-gray   { background: #f3f4f6; }

.tool-info { flex: 1; min-width: 0; }
.tool-name { font-weight: 600; font-size: 13px; }
.tool-desc { font-size: 12px; color: var(--muted); margin-top: 1px; }

.tool-arrow { color: var(--muted); font-size: 16px; flex-shrink: 0; }

.tools-loading { font-size: 12px; color: var(--muted); padding: 6px 0; }
.tools-error   { font-size: 12px; color: #b91c1c; padding: 6px 0; }
</style>
</head>
<body>

<header>
  <a id="back-btn" href="/">← ViscoSuite</a>
  <h1>◈ ViscoLink</h1>
  <span class="sub">Integration Layer</span>
</header>

<main>
  <div class="section-title">Tools</div>
  <div class="tool-list" id="tool-list">
    <div class="tools-loading">Loading…</div>
  </div>

  <div class="section-title">Framework</div>
  <div class="tool-list">
    <a class="tool-card" href="./iaf/gui/">
      <div class="tool-icon icon-gray">⚙</div>
      <div class="tool-info">
        <div class="tool-name">Frank!Console</div>
        <div class="tool-desc">Adapter status, Ladybug debugger, configuration management</div>
      </div>
      <span class="tool-arrow">›</span>
    </a>
  </div>
</main>

<script>
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function loadTools() {
  const list = document.getElementById('tool-list');
  try {
    const resp = await fetch('/viscolink/tools/registry');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const tools = await resp.json();
    if (tools.length === 0) {
      list.innerHTML = '<div class="tools-loading">No tools registered.</div>';
      return;
    }
    list.innerHTML = tools.map(t => `
      <a class="tool-card" href="${esc(t.url)}">
        <div class="tool-icon icon-teal">⬡</div>
        <div class="tool-info">
          <div class="tool-name">${esc(t.name)}</div>
          <div class="tool-desc">${esc(t.description)}</div>
        </div>
        <span class="tool-arrow">›</span>
      </a>`).join('');
  } catch (e) {
    list.innerHTML = `<div class="tools-error">Could not load tools: ${esc(e.message)}</div>`;
  }
}

document.addEventListener('DOMContentLoaded', loadTools);
</script>

</body>
</html>
