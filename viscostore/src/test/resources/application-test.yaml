hapi:
  fhir:
    fhir_version: R4
    advanced_lucene_indexing: false
    search_index_full_text_enabled: false
    mdm_enabled: false

# Satisfy ${VISCOSTORE_PASSWORD} placeholder so autoconfiguration condition evaluation doesn't
# blow up with PlaceholderResolutionException even though SecurityConfig is inactive in tests.
VISCOSTORE_PASSWORD: test-placeholder

spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchRestClientAutoConfiguration
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
