# ViscoSuite CI/CD pipeline
#
# Stages:
#   test     — unit + integration tests, plus viscorunner's two fast class-path ITs (all branches and MRs)
#   package  — full Maven build, produces WARs for the Docker image (main only)
#   docker   — builds platform-specific images in parallel (main only)
#   manifest — combines amd64 + arm64 images into a single multi-arch manifest (main only)
#   cleanup  — deletes per-arch intermediate tags; keeps only the multi-arch tags below
#
# Runners: self-hosted Docker runners
#   amd64: tags [docker, x86-64, dind]
#   arm64: tags [docker, arm64, dind]  (Raspberry Pi 5)
# Registry: $CI_REGISTRY_IMAGE (GitLab project registry)
#
# Images (the runner images are ONE recipe, viscorunner/Dockerfile, x PACK x STORE):
#   image        PACK    STORE       tags (all multi-arch)
#   viscorunner  health  viscostore  :<sha>        :latest        :<sha>-health  :latest-health
#   viscolink    health  none        :<sha>        :latest        :<sha>-health  :latest-health
#   viscolink    core    none        :<sha>-core   :latest-core
#   viscostore   -       -           :<sha>        :latest        (viscorunner/Dockerfile.viscostore)
# The unsuffixed tags keep their old meaning (health); -health is the explicit spelling and
# -core is the pack-less core. Per-arch build intermediates are <tag>-amd64 / <tag>-arm64.

stages:
  - test
  - package
  - integration-test
  - docker
  - manifest
  - downstream
  - cleanup

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  # -B: batch mode (no ANSI colours, no interactive prompts)
  # No -U: the F!F dependency is pinned to a TIMESTAMPED snapshot version
  # (frankframework.version in the root pom), which is immutable — the version
  # string IS the timestamp, so there is no stale-metadata problem for -U to
  # solve, and -U would force remote metadata checks against WAF's Nexus for
  # every snapshot artifact in every job. Bumping to a newer nightly changes
  # the version string, which forces the fresh download by itself.
  MAVEN_CLI_OPTS: "-B -s .mvn/settings.xml"
  IMAGE:           $CI_REGISTRY_IMAGE/viscorunner   # combined image
  IMAGE_VISCOLINK: $CI_REGISTRY_IMAGE/viscolink     # ViscoLink-only image
  IMAGE_VISCOSTORE: $CI_REGISTRY_IMAGE/viscostore   # ViscoStore-only image
  # Disable TLS for Docker-in-Docker on self-hosted runners
  DOCKER_TLS_CERTDIR: ""

# Maven dependency cache — ONE shared key across all branches: the local repo is
# append-only in practice (versions are pinned, releases immutable), so a per-branch
# key only forces every new branch to re-download the full F!F tree from WAF's Nexus.
# Branch/MR jobs pull; only the main-only package job pushes, so concurrent MR
# pipelines never race on the cache upload and jobs skip the multi-GB re-zip.
# Applied explicitly only to Maven jobs; docker/manifest/cleanup jobs opt out via
# cache: [] so they don't emit "no matching files" warnings.
.maven-cache: &maven-cache
  cache:
    key: maven-repo
    paths:
      - .m2/repository/
    policy: pull

.maven-cache-push: &maven-cache-push
  cache:
    key: maven-repo
    paths:
      - .m2/repository/
    policy: pull-push

# ---------------------------------------------------------------------------
# Stage: test
# Unit and integration tests for viscolink, the health pack and viscostore.
# Runs on every push and every merge request.
#
# Then viscorunner's two fast class-path ITs (HealthClasspathIT, the D8 oracle with its frozen
# golden, and PackOverlayLayoutIT) so a Frank!Framework / ladybug / HAPI bump or a pack pom
# change is caught on the merge request, not after the merge (the slow launcher ITs stay in
# integration-test, main only). One `install` (tests on) both runs the three modules' tests and
# leaves their artifacts in .m2/, which viscorunner's copy-dependencies and unpack resolve from
# (not the reactor — see CLAUDE.md); a separate `verify` would package everything twice.
# `verify -pl viscorunner` also runs viscorunner's unit tests (Dockerfile contract, event publisher).
# ---------------------------------------------------------------------------
test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  <<: *maven-cache
  before_script:
    - apt-get update
    - apt-get install -y curl ca-certificates
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - corepack enable
    - corepack prepare pnpm@9.14.2 --activate
  tags: [docker]
  script:
    - ./mvnw $MAVEN_CLI_OPTS install -pl viscolink,packs/health,viscostore
    - ./mvnw $MAVEN_CLI_OPTS verify -pl viscorunner -Dit.test=HealthClasspathIT,PackOverlayLayoutIT
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# ---------------------------------------------------------------------------
# Stage: package
# Pure artifact production — no tests.  Installs viscolink, the health pack and
# viscostore to .m2/ so that viscorunner's copy-dependencies can resolve them, then
# packages viscorunner (copies WARs + drivers into target/ and stages the pack
# overlays, the demo sets and the store WARs that the one Dockerfile COPYs).
# (packs/health/util/hl7util is a utility, not part of the image: CI does not build it.)
#
# NOTE: install before package is required because copy-dependencies resolves
# from .m2/ rather than the reactor — see CLAUDE.md.
# ---------------------------------------------------------------------------
package:
  stage: package
  image: maven:3.9-eclipse-temurin-21
  <<: *maven-cache-push
  before_script:
    - apt-get update
    - apt-get install -y curl ca-certificates
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - corepack enable
    - corepack prepare pnpm@9.14.2 --activate
  tags: [docker]
  script:
    - ./mvnw $MAVEN_CLI_OPTS install -pl viscolink,packs/health,viscostore -DskipTests
    - ./mvnw $MAVEN_CLI_OPTS package -pl viscorunner -DskipTests
  artifacts:
    paths:
      - viscorunner/target/viscolink.war
      - viscorunner/target/viscostore.war
      - viscorunner/target/drivers/
      # Staged for viscorunner/Dockerfile: packs/<PACK>/ (webapp overlay), demo/<PACK>/
      # (demo configurations), store/<STORE>/ (viscostore.war, or nothing for none).
      - viscorunner/target/packs/
      - viscorunner/target/demo/
      - viscorunner/target/store/
      # Shaded viscorunner jar (fabric8 + relocated Jackson/SnakeYAML) for ContextFailureEventPublisher,
      # placed on Tomcat's common.loader at /opt/frank/lib by the Dockerfile.
      - viscorunner/target/viscorunner-*.jar
    # target/store/viscostore/viscostore.war is a second copy of target/viscostore.war (about
    # 350 MB, already an artifact above): shipping both would add that to every pipeline and to
    # each of the eight docker jobs that download it. The docker jobs recreate it (.docker-build).
    exclude:
      - viscorunner/target/store/viscostore/viscostore.war
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ---------------------------------------------------------------------------
# Stage: integration-test
# Runs viscorunner's LabEnrichmentIT (starts real viscostore + viscolink
# processes with the health pack's overlay).  Re-installs viscolink, the health
# pack and viscostore from cache so the launcher JARs are in .m2/, then runs
# verify which repackages and fires failsafe.
# Docker build depends on both this job and package, so a failing IT blocks
# the image push.
# ---------------------------------------------------------------------------
integration-test:
  stage: integration-test
  image: maven:3.9-eclipse-temurin-21
  <<: *maven-cache
  before_script:
    - apt-get update
    - apt-get install -y curl ca-certificates
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - corepack enable
    - corepack prepare pnpm@9.14.2 --activate
  tags: [docker]
  script:
    - ./mvnw $MAVEN_CLI_OPTS install -pl viscolink,packs/health,viscostore -DskipTests
    - ./mvnw $MAVEN_CLI_OPTS verify   -pl viscorunner
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ---------------------------------------------------------------------------
# Stage: docker
# Builds a platform-specific image on each native runner and pushes it with
# a platform suffix tag, e.g.:
#   <registry>/viscorunner:<sha>-amd64
#   <registry>/viscorunner:<sha>-arm64
# The jobs run in parallel.
#
# One recipe (viscorunner/Dockerfile) x PACK x STORE x arch. The image name and
# the tag suffix per variant:
#   health + viscostore -> viscorunner:<sha>[-arch]        (today's meaning, kept)
#   health + none       -> viscolink:<sha>[-arch]          (today's meaning, kept)
#   core   + none       -> viscolink:<sha>-core[-arch]
# .docker-build is the shared recipe; each job names its runner (tags), its arch and
# one of the three variant variable sets below.
# ---------------------------------------------------------------------------
.docker-build:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  needs:
    - job: package
      artifacts: true
    - job: integration-test
      artifacts: false
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    # Empty directories may not survive the artifact zip; COPY of a missing source would fail every STORE=none build.
    - mkdir -p viscorunner/target/store/none viscorunner/target/packs/core/WEB-INF/lib
    # The store copy is not an artifact (package excludes it, it is a duplicate of target/viscostore.war): recreate it.
    - if [ "$STORE" != none ]; then mkdir -p viscorunner/target/store/viscostore && cp viscorunner/target/viscostore.war viscorunner/target/store/viscostore/viscostore.war; fi
    - docker build --platform "linux/$ARCH"
        --build-arg "PACK=$PACK" --build-arg "STORE=$STORE"
        --build-arg "BUILD_TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC') · $CI_COMMIT_SHORT_SHA"
        -t "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHA$TAG_SUFFIX-$ARCH"
        viscorunner/
    - docker push "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_SHA$TAG_SUFFIX-$ARCH"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# Per-variant variables (merged into each job's `variables` below).
.health-suite: &health-suite
  PACK: health
  STORE: viscostore
  IMAGE_NAME: viscorunner
  TAG_SUFFIX: ""
.health-link: &health-link
  PACK: health
  STORE: none
  IMAGE_NAME: viscolink
  TAG_SUFFIX: ""
.core-link: &core-link
  PACK: core
  STORE: none
  IMAGE_NAME: viscolink
  TAG_SUFFIX: "-core"

docker:viscosuite:amd64:      { extends: .docker-build, tags: [docker, x86-64, dind], variables: { <<: *health-suite, ARCH: amd64 } }
docker:viscosuite:arm64:      { extends: .docker-build, tags: [docker, arm64, dind],  variables: { <<: *health-suite, ARCH: arm64 } }
docker:viscolink:amd64:       { extends: .docker-build, tags: [docker, x86-64, dind], variables: { <<: *health-link,  ARCH: amd64 } }
docker:viscolink:arm64:       { extends: .docker-build, tags: [docker, arm64, dind],  variables: { <<: *health-link,  ARCH: arm64 } }
docker:viscolink-core:amd64:  { extends: .docker-build, tags: [docker, x86-64, dind], variables: { <<: *core-link,    ARCH: amd64 } }
docker:viscolink-core:arm64:  { extends: .docker-build, tags: [docker, arm64, dind],  variables: { <<: *core-link,    ARCH: arm64 } }

# ---------------------------------------------------------------------------
# Stage: docker — standalone ViscoStore image
# ---------------------------------------------------------------------------
docker:viscostore:amd64:
  stage: docker
  image: docker:27
  tags: [docker, x86-64, dind]
  services:
    - docker:27-dind
  needs:
    - job: package
      artifacts: true
    - job: integration-test
      artifacts: false
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build --platform linux/amd64
        -f viscorunner/Dockerfile.viscostore
        -t "$IMAGE_VISCOSTORE:$CI_COMMIT_SHA-amd64"
        viscorunner/
    - docker push "$IMAGE_VISCOSTORE:$CI_COMMIT_SHA-amd64"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

docker:viscostore:arm64:
  stage: docker
  image: docker:27
  tags: [docker, arm64, dind]
  services:
    - docker:27-dind
  needs:
    - job: package
      artifacts: true
    - job: integration-test
      artifacts: false
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build --platform linux/arm64
        -f viscorunner/Dockerfile.viscostore
        -t "$IMAGE_VISCOSTORE:$CI_COMMIT_SHA-arm64"
        viscorunner/
    - docker push "$IMAGE_VISCOSTORE:$CI_COMMIT_SHA-arm64"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ---------------------------------------------------------------------------
# Stage: manifest
# Combines platform images into multi-arch manifests.
# Combined:       <registry>/viscorunner:<sha>     + :latest + :<sha>-health + :latest-health
# ViscoLink:      <registry>/viscolink:<sha>       + :latest + :<sha>-health + :latest-health
# ViscoLink core: <registry>/viscolink:<sha>-core  + :latest-core
# ViscoStore:     <registry>/viscostore:<sha>      + :latest
# (-health tags are extra names for the same manifest as the unsuffixed ones: no extra build.)
# ---------------------------------------------------------------------------
manifest:viscosuite:
  stage: manifest
  image: docker:27
  tags: [dind]
  services:
    - docker:27-dind
  needs:
    - docker:viscosuite:amd64
    - docker:viscosuite:arm64
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker buildx imagetools create
        -t "$IMAGE:$CI_COMMIT_SHA"
        -t "$IMAGE:latest"
        -t "$IMAGE:$CI_COMMIT_SHA-health"
        -t "$IMAGE:latest-health"
        "$IMAGE:$CI_COMMIT_SHA-amd64"
        "$IMAGE:$CI_COMMIT_SHA-arm64"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

manifest:viscolink:
  stage: manifest
  image: docker:27
  tags: [dind]
  services:
    - docker:27-dind
  needs:
    - docker:viscolink:amd64
    - docker:viscolink:arm64
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker buildx imagetools create
        -t "$IMAGE_VISCOLINK:$CI_COMMIT_SHA"
        -t "$IMAGE_VISCOLINK:latest"
        -t "$IMAGE_VISCOLINK:$CI_COMMIT_SHA-health"
        -t "$IMAGE_VISCOLINK:latest-health"
        "$IMAGE_VISCOLINK:$CI_COMMIT_SHA-amd64"
        "$IMAGE_VISCOLINK:$CI_COMMIT_SHA-arm64"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

manifest:viscolink-core:
  stage: manifest
  image: docker:27
  tags: [dind]
  services:
    - docker:27-dind
  needs:
    - docker:viscolink-core:amd64
    - docker:viscolink-core:arm64
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker buildx imagetools create
        -t "$IMAGE_VISCOLINK:$CI_COMMIT_SHA-core"
        -t "$IMAGE_VISCOLINK:latest-core"
        "$IMAGE_VISCOLINK:$CI_COMMIT_SHA-core-amd64"
        "$IMAGE_VISCOLINK:$CI_COMMIT_SHA-core-arm64"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

manifest:viscostore:
  stage: manifest
  image: docker:27
  tags: [dind]
  services:
    - docker:27-dind
  needs:
    - docker:viscostore:amd64
    - docker:viscostore:arm64
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker buildx imagetools create
        -t "$IMAGE_VISCOSTORE:$CI_COMMIT_SHA"
        -t "$IMAGE_VISCOSTORE:latest"
        "$IMAGE_VISCOSTORE:$CI_COMMIT_SHA-amd64"
        "$IMAGE_VISCOSTORE:$CI_COMMIT_SHA-arm64"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ---------------------------------------------------------------------------
# Stage: downstream
# Once the combined multi-arch viscorunner image is published, trigger the
# ViscoForge pipeline so it rebuilds against the new base image. GitLab cannot
# start a pipeline "on registry push", so the upstream pipeline emits the trigger.
#
# Requires (ViscoForge side): Settings -> CI/CD -> Token Access must allow this
# project (public-applications/viscosuite) to trigger via CI_JOB_TOKEN, and its
# .gitlab-ci.yml must run on `$CI_PIPELINE_SOURCE == "pipeline"`.
#
# allow_failure keeps the ViscoSuite pipeline green while the ViscoForge side is
# being wired up; drop it once the trigger is confirmed working.
# ---------------------------------------------------------------------------
trigger:viscoforge:
  stage: downstream
  # Wait for EVERY base image ViscoForge builds FROM: viscorunner (suite stack),
  # viscolink (link stack) and viscolink's core variant (link stack, PACK=core). All
  # carry the same $CI_COMMIT_SHA tag (the core one with the -core suffix); without
  # the core manifest here, Forge's core build could race the tag on a slow arm64 day.
  needs:
    - manifest:viscosuite
    - manifest:viscolink
    - manifest:viscolink-core
  allow_failure: true
  variables:
    # The exact tag just pushed for viscorunner, viscolink AND viscolink:<sha>-core;
    # ViscoForge builds FROM them.
    UPSTREAM_TAG: "$CI_COMMIT_SHA"
  trigger:
    project: commercial/viscoforge   # << confirm ViscoForge's project path
    branch: main
    # strategy: depend   # uncomment to make THIS pipeline wait for / reflect ViscoForge's result
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ---------------------------------------------------------------------------
# Stage: cleanup
# Deletes per-arch intermediate tags (:<sha>-amd64, :<sha>-arm64, and for the
# core variant :<sha>-core-amd64, :<sha>-core-arm64) immediately after manifests
# are pushed — these are build intermediates only.
# Keeping only the multi-arch tags (:<sha>, :latest, -health, -core; see the header).
#
# "Keep last N builds" is handled by GitLab's built-in cleanup policy:
# Settings → Packages and registries → Cleanup policies
# ---------------------------------------------------------------------------
cleanup:arch-tags:
  stage: cleanup
  image: alpine:3
  tags: [docker]
  needs:
    - manifest:viscosuite
    - manifest:viscolink
    - manifest:viscolink-core
    - manifest:viscostore
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      REPOS=$(curl --silent --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/registry/repositories")
      # "<image>:<tag suffix>" pairs (an empty suffix is the plain <sha>-<arch> tag).
      # The viscolink repo holds two variants: health (no suffix) and core (-core).
      for PAIR in "viscorunner:" "viscolink:" "viscolink:-core" "viscostore:"; do
        IMAGE_NAME=${PAIR%%:*}
        TAG_SUFFIX=${PAIR#*:}
        REPO_ID=$(echo "$REPOS" | jq -r ".[] | select(.name == \"${IMAGE_NAME}\") | .id")
        if [ -z "$REPO_ID" ] || [ "$REPO_ID" = "null" ]; then
          echo "WARNING: repo not found for ${IMAGE_NAME}, skipping"
          continue
        fi
        for ARCH in amd64 arm64; do
          TAG="${CI_COMMIT_SHA}${TAG_SUFFIX}-${ARCH}"
          STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --request DELETE \
            --header "JOB-TOKEN: $CI_JOB_TOKEN" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/registry/repositories/${REPO_ID}/tags/${TAG}")
          echo "${IMAGE_NAME}:${TAG} → HTTP ${STATUS}"
        done
      done
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ---------------------------------------------------------------------------
# Open-source distribution
#
# GitHub is the community front door; this GitLab is the system of record.
# Branches and tags reach GitHub via push mirroring (Settings → Repository →
# Mirroring repositories: push, GitHub classic PAT with the `repo` scope,
# "keep divergent refs" off). Releases do NOT mirror, so this job creates the
# GitHub Release when a tag is pushed. Requires CI/CD variable GITHUB_TOKEN
# (masked, Protected): a PAT that can write viscosiety/viscosuite contents.
# GITHUB_TOKEN being Protected means it is ONLY visible on protected refs —
# tags must match a protected-tag pattern (v*) under Settings → Repository →
# Protected tags, or the job runs with an empty token.
#
# target_commitish covers mirror lag: if the tag hasn't reached GitHub yet
# when this runs, GitHub creates it on the right commit instead of on the
# default branch's head. A 422 means the release already exists (job retry,
# or a tag re-push) and is treated as success.
# ---------------------------------------------------------------------------

github-release:
  stage: downstream
  image: alpine:3.20
  tags: [docker]
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - apk add --no-cache curl
    - |
      if [ -z "${GITHUB_TOKEN}" ]; then
        echo "ERROR: GITHUB_TOKEN is empty in this job."
        echo "It is defined as a Protected CI/CD variable, so it is only injected on protected refs."
        echo "Fix: protect tags matching 'v*' under Settings -> Repository -> Protected tags,"
        echo "or untick 'Protected' on the GITHUB_TOKEN variable."
        exit 1
      fi
    - |
      STATUS=$(curl --silent --show-error --output /tmp/gh-release.json --write-out "%{http_code}" -X POST \
        -H "Authorization: Bearer ${GITHUB_TOKEN}" \
        -H "Accept: application/vnd.github+json" \
        https://api.github.com/repos/viscosiety/viscosuite/releases \
        -d "{\"tag_name\":\"${CI_COMMIT_TAG}\",\"target_commitish\":\"${CI_COMMIT_SHA}\",\"name\":\"ViscoSuite ${CI_COMMIT_TAG}\",\"generate_release_notes\":true}")
      cat /tmp/gh-release.json
      echo ""
      case "$STATUS" in
        201) echo "GitHub release created for ${CI_COMMIT_TAG}." ;;
        422) echo "GitHub release for ${CI_COMMIT_TAG} already exists - nothing to do." ;;
        401|403) echo "GitHub rejected the token (HTTP ${STATUS}) - check the PAT's scope/expiry."; exit 1 ;;
        404) echo "HTTP 404 - the PAT cannot see viscosiety/viscosuite (needs the 'repo' scope on a classic PAT)."; exit 1 ;;
        *) echo "GitHub API returned HTTP ${STATUS}."; exit 1 ;;
      esac
