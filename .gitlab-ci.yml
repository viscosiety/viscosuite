    - docker:viscostore:arm64
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker buildx imagetools create
        -t "$IMAGE_VISCOSTORE:$CI_COMMIT_SHA"
        -t "$IMAGE_VISCOSTORE:latest"
        "$IMAGE_VISCOSTORE:$CI_COMMIT_SHA-amd64"
        "$IMAGE_VISCOSTORE:$CI_COMMIT_SHA-arm64"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ---------------------------------------------------------------------------
# Stage: downstream
# Once the combined multi-arch viscorunner image is published, trigger the
# ViscoForge pipeline so it rebuilds against the new base image. GitLab cannot
# start a pipeline "on registry push", so the upstream pipeline emits the trigger.
#
# Requires (ViscoForge side): Settings -> CI/CD -> Token Access must allow this
# project (public-applications/viscosuite) to trigger via CI_JOB_TOKEN, and its
# .gitlab-ci.yml must run on `$CI_PIPELINE_SOURCE == "pipeline"`.
#
# allow_failure keeps the ViscoSuite pipeline green while the ViscoForge side is
# being wired up; drop it once the trigger is confirmed working.
# ---------------------------------------------------------------------------
trigger:viscoforge:
  stage: downstream
  # Wait for BOTH base images ViscoForge builds FROM: viscorunner (suite stack) and
  # viscolink (link stack). Both carry the same $CI_COMMIT_SHA tag.
  needs:
    - manifest:viscosuite
    - manifest:viscolink
  allow_failure: true
  variables:
    # The exact tag just pushed for viscorunner AND viscolink; ViscoForge builds FROM it.
    UPSTREAM_TAG: "$CI_COMMIT_SHA"
  trigger:
    project: commercial/viscoforge   # << confirm ViscoForge's project path
    branch: main
    # strategy: depend   # uncomment to make THIS pipeline wait for / reflect ViscoForge's result
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ---------------------------------------------------------------------------
# Stage: cleanup
# Deletes per-arch intermediate tags (:<sha>-amd64, :<sha>-arm64) immediately
# after manifests are pushed — these are build intermediates only.
# Keeping only :<sha> (multi-arch manifest) + :latest per image.
#
# "Keep last N builds" is handled by GitLab's built-in cleanup policy:
# Settings → Packages and registries → Cleanup policies
# ---------------------------------------------------------------------------
cleanup:arch-tags:
  stage: cleanup
  image: alpine:3
  tags: [docker]
  needs:
    - manifest:viscosuite
    - manifest:viscolink
    - manifest:viscostore
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      REPOS=$(curl --silent --header "JOB-TOKEN: $CI_JOB_TOKEN" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/registry/repositories")
      for IMAGE_NAME in viscorunner viscolink viscostore; do
        REPO_ID=$(echo "$REPOS" | jq -r ".[] | select(.name == \"${IMAGE_NAME}\") | .id")
        if [ -z "$REPO_ID" ] || [ "$REPO_ID" = "null" ]; then
          echo "WARNING: repo not found for ${IMAGE_NAME}, skipping"
          continue
        fi
        for SUFFIX in amd64 arm64; do
          TAG="${CI_COMMIT_SHA}-${SUFFIX}"
          STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --request DELETE \
            --header "JOB-TOKEN: $CI_JOB_TOKEN" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/registry/repositories/${REPO_ID}/tags/${TAG}")
          echo "${IMAGE_NAME}:${TAG} → HTTP ${STATUS}"
        done
      done
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ---------------------------------------------------------------------------
# Open-source distribution
#
# GitHub is the community front door; this GitLab is the system of record.
# Branches and tags reach GitHub via push mirroring (Settings → Repository →
# Mirroring repositories: push, GitHub classic PAT with the `repo` scope,
# "keep divergent refs" off). Releases do NOT mirror, so this job creates the
# GitHub Release when a tag is pushed. Requires CI/CD variable GITHUB_TOKEN
# (masked, Protected): a PAT that can write viscosiety/viscosuite contents.
# GITHUB_TOKEN being Protected means it is ONLY visible on protected refs —
# tags must match a protected-tag pattern (v*) under Settings → Repository →
# Protected tags, or the job runs with an empty token.
#
# target_commitish covers mirror lag: if the tag hasn't reached GitHub yet
# when this runs, GitHub creates it on the right commit instead of on the
# default branch's head. A 422 means the release already exists (job retry,
# or a tag re-push) and is treated as success.
# ---------------------------------------------------------------------------

github-release:
  stage: downstream
  image: alpine:3.20
  tags: [docker]
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - apk add --no-cache curl
    - |
      if [ -z "${GITHUB_TOKEN}" ]; then
        echo "ERROR: GITHUB_TOKEN is empty in this job."
        echo "It is defined as a Protected CI/CD variable, so it is only injected on protected refs."
        echo "Fix: protect tags matching 'v*' under Settings -> Repository -> Protected tags,"
        echo "or untick 'Protected' on the GITHUB_TOKEN variable."
        exit 1
      fi
    - |
      STATUS=$(curl --silent --show-error --output /tmp/gh-release.json --write-out "%{http_code}" -X POST \
        -H "Authorization: Bearer ${GITHUB_TOKEN}" \
        -H "Accept: application/vnd.github+json" \
        https://api.github.com/repos/viscosiety/viscosuite/releases \
        -d "{\"tag_name\":\"${CI_COMMIT_TAG}\",\"target_commitish\":\"${CI_COMMIT_SHA}\",\"name\":\"ViscoSuite ${CI_COMMIT_TAG}\",\"generate_release_notes\":true}")
      cat /tmp/gh-release.json
      echo ""
      case "$STATUS" in
        201) echo "GitHub release created for ${CI_COMMIT_TAG}." ;;
        422) echo "GitHub release for ${CI_COMMIT_TAG} already exists - nothing to do." ;;
        401|403) echo "GitHub rejected the token (HTTP ${STATUS}) - check the PAT's scope/expiry."; exit 1 ;;
        404) echo "HTTP 404 - the PAT cannot see viscosiety/viscosuite (needs the 'repo' scope on a classic PAT)."; exit 1 ;;
        *) echo "GitHub API returned HTTP ${STATUS}."; exit 1 ;;
      esac
