# ViscoSuite CI/CD pipeline
#
# Stages:
#   test     — unit + integration tests (all branches and MRs)
#   package  — full Maven build, produces WARs for the Docker image (main only)
#   docker   — builds platform-specific images in parallel (main only)
#   manifest — combines amd64 + arm64 images into a single multi-arch manifest (main only)
#
# Runners: self-hosted Docker runners
#   amd64: tags [docker, dind]
#   arm64: tags [docker, arm64, dind]  (Raspberry Pi 5)
# Registry: $CI_REGISTRY_IMAGE (GitLab project registry)

stages:
  - test
  - package
  - docker
  - manifest

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  # -B: batch mode (no ANSI colours, no interactive prompts)
  # --no-transfer-progress: suppresses the per-chunk download progress lines
  MAVEN_CLI_OPTS: "-B -s .mvn/settings.xml"
  IMAGE: $CI_REGISTRY_IMAGE/viscorunner
  # Disable TLS for Docker-in-Docker on self-hosted runners
  DOCKER_TLS_CERTDIR: ""

# Maven dependency cache — keyed per branch so branches don't invalidate each other
default:
  cache:
    key: "maven-$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository/

# ---------------------------------------------------------------------------
# Stage: test
# Unit and integration tests for viscolink and viscostore.
# Runs on every push and every merge request.
# ---------------------------------------------------------------------------
test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  tags: [docker]
  script:
    - mvn $MAVEN_CLI_OPTS verify -pl viscolink,viscostore
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# ---------------------------------------------------------------------------
# Stage: package
# Installs viscolink + viscostore to the local repository (tests already ran
# in the test stage, so -DskipTests avoids repeating them), then runs
# viscorunner's integration tests (LabEnrichmentIT) via 'verify', which also
# executes the package phase and copies the WARs into viscorunner/target/.
#
# NOTE: 'install' for viscolink/viscostore before 'verify' for viscorunner is
# required because maven-dependency-plugin's copy-dependencies resolves from
# .m2/ rather than the reactor — see CLAUDE.md.
# ---------------------------------------------------------------------------
package:
  stage: package
  image: maven:3.9-eclipse-temurin-21
  tags: [docker]
  script:
    - mvn $MAVEN_CLI_OPTS install -pl viscolink,viscostore -DskipTests
    - mvn $MAVEN_CLI_OPTS verify   -pl viscorunner
  artifacts:
    paths:
      - viscorunner/target/viscolink.war
      - viscorunner/target/viscostore.war
      - viscorunner/target/drivers/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ---------------------------------------------------------------------------
# Stage: docker
# Builds a platform-specific image on each native runner and pushes it with
# a platform suffix tag, e.g.:
#   <registry>/viscorunner:<sha>-amd64
#   <registry>/viscorunner:<sha>-arm64
# The two jobs run in parallel.
# ---------------------------------------------------------------------------
docker:amd64:
  stage: docker
  image: docker:27
  tags: [docker, x86-64, dind]
  services:
    - docker:27-dind
  needs:
    - job: package
      artifacts: true
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build --platform linux/amd64
        -t "$IMAGE:$CI_COMMIT_SHA-amd64"
        viscorunner/
    - docker push "$IMAGE:$CI_COMMIT_SHA-amd64"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

docker:arm64:
  stage: docker
  image: docker:27
  tags: [docker, arm64, dind]
  services:
    - docker:27-dind
  needs:
    - job: package
      artifacts: true
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build --platform linux/arm64
        -t "$IMAGE:$CI_COMMIT_SHA-arm64"
        viscorunner/
    - docker push "$IMAGE:$CI_COMMIT_SHA-arm64"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ---------------------------------------------------------------------------
# Stage: manifest
# Combines the two platform images into a single multi-arch manifest and
# pushes two final tags:
#   - <registry>/viscorunner:<commit-sha>  (immutable)
#   - <registry>/viscorunner:latest        (floating)
# ---------------------------------------------------------------------------
manifest:
  stage: manifest
  image: docker:27
  tags: [dind]
  services:
    - docker:27-dind
  needs:
    - docker:amd64
    - docker:arm64
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker buildx imagetools create
        -t "$IMAGE:$CI_COMMIT_SHA"
        -t "$IMAGE:latest"
        "$IMAGE:$CI_COMMIT_SHA-amd64"
        "$IMAGE:$CI_COMMIT_SHA-arm64"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
