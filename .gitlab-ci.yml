# ---------------------------------------------------------------------------
# Stage: manifest
# Combines platform images into multi-arch manifests.
# Combined:   <registry>/viscorunner:<sha> + :latest
# ViscoLink:  <registry>/viscolink:<sha>   + :latest
# ViscoStore: <registry>/viscostore:<sha>  + :latest
# ---------------------------------------------------------------------------
manifest:viscosuite:
  stage: manifest
  image: docker:27
  tags: [dind]
  services:
    - docker:27-dind
  needs:
    - docker:viscosuite:amd64
    - docker:viscosuite:arm64
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker buildx imagetools create
        -t "$IMAGE:$CI_COMMIT_SHA"
        -t "$IMAGE:latest"
        "$IMAGE:$CI_COMMIT_SHA-amd64"
        "$IMAGE:$CI_COMMIT_SHA-arm64"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

manifest:viscolink:
  stage: manifest
  image: docker:27
  tags: [dind]
  services:
    - docker:27-dind
  needs:
    - docker:viscolink:amd64
    - docker:viscolink:arm64
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker buildx imagetools create
        -t "$IMAGE_VISCOLINK:$CI_COMMIT_SHA"
        -t "$IMAGE_VISCOLINK:latest"
        "$IMAGE_VISCOLINK:$CI_COMMIT_SHA-amd64"
        "$IMAGE_VISCOLINK:$CI_COMMIT_SHA-arm64"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

manifest:viscostore:
  stage: manifest
  image: docker:27
  tags: [dind]
  services:
    - docker:27-dind
  needs:
