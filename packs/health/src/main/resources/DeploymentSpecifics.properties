# Healthcare pack defaults. Merged into the Frank!Framework property chain next to the core's
# DeploymentSpecifics.properties (every copy on the class path is loaded). RULE: this file only
# ADDS keys the core does not define — on a clash the resource-set order decides, and that is
# Tomcat's, not a contract. Tenants' StageSpecifics, environment and system properties still win.

# MLLP inbound listener identity — used in MSH.3 / MSH.4 of outbound ACK messages
mllp.inbound.sendingApplication=viscolink
mllp.inbound.sendingFacility=viscosiety

# Target FHIR version for the HL7v2-to-FHIR conversion pipeline.
# Determines which XSLT subfolder (xslt/<version>/) and XSD subfolder (xsd/<version>/)
# are used. Supported values: r4
fhir.target.version=r4

# viscostore FHIR base URL — transaction bundles are POSTed here
viscostore.fhir.base.url=http://localhost:8080/viscostore/fhir/

# Fallback NamingSystem base URL for MR identifiers whose assigning authority (CX.4)
# carries only a text name (HD.1) rather than an OID (HD.2).
# Must end with a trailing slash.
mr.system.base=https://ig.viscosiety.com/fhir/NamingSystem/
