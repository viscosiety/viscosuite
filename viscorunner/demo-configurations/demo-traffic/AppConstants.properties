# Scoped to the demo-traffic configuration only (per-configuration classloader).
#
# Without these, HttpSender propagates Message-Id/Correlation-Id to the demo
# intakes, and Ladybug then folds the intake's processing into the generator's
# own report instead of recording an independent journey per intake message.
# A real external sender carries neither header; the generator should look
# exactly like one.
http.headers.messageid=false
http.headers.correlationid=false
