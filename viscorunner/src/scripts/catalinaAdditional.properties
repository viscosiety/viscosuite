# Appended to $CATALINA_HOME/conf/catalina.properties at image build time.
# Settings here apply to ALL webapps in this Tomcat instance (both ViscoLink and ViscoStore).

# Frank!Framework runtime directories
log.dir=/usr/local/tomcat/logs
dtap.stage=LOC

# Resources and configurations loaded by Frank!Framework
shared.loader=/opt/frank/resources/,/opt/frank/resources/*.jar

# JDBC drivers in /opt/frank/drivers/ are appended here so both WARs can use them
# without bundling them inside either WAR.
common.loader="${catalina.base}/lib","${catalina.base}/lib/*.jar","${catalina.home}/lib","${catalina.home}/lib/*.jar","/opt/frank/drivers/*.jar","/opt/frank/lib/*.jar"

# Frank!Framework reads configurations from here (outside the WAR, so they can be updated without redeployment)
configurations.directory=/opt/frank/configurations
plugins.directory=/opt/frank/plugins

# Larva test scenarios
scenariosroot1.directory=/opt/frank/testtool
scenariosroot1.description=embedded testtool directory /opt/frank/testtool
scenariosroot2.directory=/opt/frank/testtool-ext
scenariosroot2.description=external testtool directory /opt/frank/testtool-ext

# Restrict which paths the Frank!Console log viewer may read
FileViewer.permission.rules=${credentialFactory.filesystem.root:-/dev/null} * deny | ${credentialFactory.map.properties:-/dev/null} * deny | /usr/local/tomcat/logs * allow | /opt/frank * allow

# Enable environment variable substitution in Tomcat's XML config files (context.xml, server.xml, etc.)
org.apache.tomcat.util.digester.PROPERTY_SOURCE=org.apache.tomcat.util.digester.EnvironmentPropertySource

# Skip JAR scanning on startup for faster boot (scan only Frank!Framework JARs)
tomcat.util.scan.StandardJarScanFilter.jarsToSkip=*.jar
tomcat.util.scan.StandardJarScanFilter.jarsToScan=frankframework-*.jar

# HTTP transport — use a reverse proxy (nginx/traefik) for TLS termination in production
application.security.http.transportGuarantee=NONE

# Log4j2 — include stdout JSON appender for container log collection
log4j.configurationFile=log4j4ibis.xml,log4j2stdout.xml

# Route all java.util.logging through Log4j2
java.util.logging.manager=org.apache.logging.log4j.jul.LogManager
