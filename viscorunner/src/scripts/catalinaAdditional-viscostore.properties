# Minimal Tomcat settings for the ViscoStore standalone image.
# ViscoStore is a Spring Boot / HAPI FHIR JPA WAR that configures its own
# datasource via env vars (VISCOSTORE_JDBC_URL etc.) — no JNDI, no F!F dirs.
# The only Tomcat-level requirement is exposing the shared JDBC drivers on
# the common.loader so the Spring classloader can find the driver class.

log.dir=/usr/local/tomcat/logs

# JDBC drivers at /opt/frank/drivers/ — keeps the driver JAR out of the WAR
common.loader="${catalina.base}/lib","${catalina.base}/lib/*.jar","${catalina.home}/lib","${catalina.home}/lib/*.jar","/opt/frank/drivers/*.jar"

# Skip full JAR scan on startup; ViscoStore has no TLD or web-fragment JARs to scan
tomcat.util.scan.StandardJarScanFilter.jarsToSkip=*.jar
tomcat.util.scan.StandardJarScanFilter.jarsToScan=
