services:

  viscorunner:
    build:
      context: .
      dockerfile: Dockerfile
    image: registry.git.viscosiety.com/public-applications/viscosuite/viscorunner:latest
    ports:
      - "8180:8080"
      - "5005:5005"
      - "2575:2575"
    environment:
      # Frank!Framework — override dtap.stage so it doesn't default to LOC
      dtap.stage: LOC

      # Enable F!F auto-discovery of all subdirectories in the configurations directory.
      configurations.directory.autoLoad: "true"
      # Use DirectoryClassLoader as the default so F!F reads configurations from the
      # mounted filesystem rather than scanning the WAR classpath.
      classloader.type: DirectoryClassLoader

      customViews.names: viscoStore,viscoLink
      customViews.viscoStore.name: ViscoStore
      customViews.viscoStore.url: /viscostore/tester/
      customViews.viscoLink.name: ViscoLink
      customViews.viscoLink.url: /viscolink/
      customViews.viscoLink.target: _self

      # Frank!Framework (viscolink) JNDI datasource
      VISCOLINK_JDBC_DRIVER: org.postgresql.Driver
      VISCOLINK_JDBC_URL: jdbc:postgresql://postgres:5432/viscolink
      VISCOLINK_JDBC_USERNAME: visco
      VISCOLINK_JDBC_PASSWORD: visco

      # ViscoStore (HAPI FHIR) datasource — overrides application.yaml defaults
      VISCOSTORE_JDBC_DRIVER: org.postgresql.Driver
      VISCOSTORE_JDBC_URL: jdbc:postgresql://postgres:5432/viscostore
      VISCOSTORE_JDBC_USERNAME: visco
      VISCOSTORE_JDBC_PASSWORD: visco
      VISCOSTORE_JDBC_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect

      # ViscoStore HTTP Basic auth — credentials used by ViscoLink to call ViscoStore
      VISCOSTORE_USERNAME: viscolink
      VISCOSTORE_PASSWORD: viscolink
      # Tester backend makes server-side HTTP calls to this address; must be reachable from within
      # the container (port 8080, not the host-mapped 8180)
      HAPI_FHIR_TESTER_HOME_SERVER_ADDRESS: http://localhost:8080/viscostore/fhir
      # Pass JPDA debug flag; entrypoint.sh appends $JAVA_OPTS to the F!F JVM flags
      JAVA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 -Dspring.profiles.active=ladybug-database -Dliquibase.duplicateFileMode=WARN -DcredentialFactory.class=org.frankframework.credentialprovider.PropertyFileCredentialFactory -DcredentialFactory.map.properties=/opt/frank/secrets/credentials.properties"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount credentials file for local development (create from credentials.properties.example)
      - ./secrets/credentials.properties:/opt/frank/secrets/credentials.properties:ro
      # Mount the configurations directory so users can add their own configurations and reload
      # them via the Frank!Console without rebuilding.  The directory is empty by default;
      # add subdirectories and set configurations.names to activate them.
      - ./configurations:/opt/frank/configurations
      - ladybug-testtool:/usr/local/tomcat/logs

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: visco
      POSTGRES_PASSWORD: visco
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visco -d viscolink && pg_isready -U visco -d viscostore"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  postgres-data:
  ladybug-testtool:
