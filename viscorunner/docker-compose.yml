services:

  viscorunner:
    build:
      context: .
      dockerfile: Dockerfile
    image: registry.git.viscosiety.com/public-applications/viscosuite/viscorunner:latest
    ports:
      - "8180:8080"
      - "5005:5005"
      - "2575:2575"
    environment:
      # Frank!Framework — override dtap.stage so it doesn't default to LOC
      dtap.stage: LOC
      configurations.names: hl7v2-to-fhir

      # Frank!Framework (viscolink) JNDI datasource
      VISCOLINK_JDBC_DRIVER: org.postgresql.Driver
      VISCOLINK_JDBC_URL: jdbc:postgresql://postgres:5432/viscolink
      VISCOLINK_JDBC_USERNAME: visco
      VISCOLINK_JDBC_PASSWORD: visco

      # ViscoStore (HAPI FHIR) datasource — overrides application.yaml defaults
      VISCOSTORE_JDBC_DRIVER: org.postgresql.Driver
      VISCOSTORE_JDBC_URL: jdbc:postgresql://postgres:5432/viscostore
      VISCOSTORE_JDBC_USERNAME: visco
      VISCOSTORE_JDBC_PASSWORD: visco
      VISCOSTORE_JDBC_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      # Tester backend makes server-side HTTP calls to this address; must be reachable from within
      # the container (port 8080, not the host-mapped 8180)
      HAPI_FHIR_TESTER_HOME_SERVER_ADDRESS: http://localhost:8080/viscostore/fhir
      # Pass JPDA debug flag; entrypoint.sh appends $JAVA_OPTS to the F!F JVM flags
      JAVA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 -Dspring.profiles.active=ladybug-database -Dliquibase.duplicateFileMode=WARN"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount credentials file for local development (create from credentials.properties.example)
      - ./secrets/credentials.properties:/opt/frank/secrets/credentials.properties:ro
      # Mount configurations so changes can be made and reloaded via the Frank!Console without rebuilding
      - ./configurations:/opt/frank/configurations

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: viscostore
      POSTGRES_USER: visco
      POSTGRES_PASSWORD: visco
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visco -d viscostore"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
