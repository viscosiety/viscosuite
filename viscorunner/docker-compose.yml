services:

  viscorunner:
    build:
      context: .
      dockerfile: Dockerfile
    image: viscorunner:local
    ports:
      - "8180:8080"
      - "5005:5005"
      - "2575:2575"
    environment:
      # Frank!Framework — override dtap.stage so it doesn't default to LOC
      dtap.stage: LOC
      configurations.names: hl7v2-to-fhir

      # Ladybug JDBC connection — shared PostgreSQL instance, separate schema via Liquibase
      ladybug.jdbc.driver: org.postgresql.Driver
      ladybug.jdbc.url: jdbc:postgresql://postgres:5432/viscostore
      ladybug.jdbc.username: visco
      ladybug.jdbc.password: visco
      
      # ViscoStore (HAPI FHIR) Spring Boot datasource — overrides application.yaml inside the WAR
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/viscostore
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: visco
      SPRING_DATASOURCE_PASSWORD: visco
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # Tester backend makes server-side HTTP calls to this address; must be reachable from within
      # the container (port 8080, not the host-mapped 8180)
      HAPI_FHIR_TESTER_HOME_SERVER_ADDRESS: http://localhost:8080/viscostore/fhir
      # Pass JPDA debug flag; entrypoint.sh appends $JAVA_OPTS to the F!F JVM flags
      JAVA_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 -Dspring.profiles.active=ladybug-database"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount credentials file for local development (create from credentials.properties.example)
      - ./secrets/credentials.properties:/opt/frank/secrets/credentials.properties:ro
      # Mount configurations so changes can be made and reloaded via the Frank!Console without rebuilding
      - ./configurations:/opt/frank/configurations

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: viscostore
      POSTGRES_USER: visco
      POSTGRES_PASSWORD: visco
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visco -d viscostore"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
