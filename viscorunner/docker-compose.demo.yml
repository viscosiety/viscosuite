# Demo overlay — mounts the reference implementation configurations and enables auto-discovery.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up --build
#
# What this overlay adds on top of the base:
#   - Mounts demo-configurations/ over /opt/frank/configurations, replacing the base
#     (empty) configurations mount with the full reference implementation.
#   - Enables Frank!Framework auto-discovery so all subdirectories in demo-configurations/
#     are loaded as F!F configurations without listing them explicitly.
#   - Sets DirectoryClassLoader as the default so externally-mounted configurations
#     are read from the filesystem rather than the WAR classpath.
#   - Provides credentials and a JNDI datasource for the fake-emr integration.
#   - Mounts demo-conf/context.xml, which extends the base context.xml with the
#     jdbc/fake-emr JNDI datasource.

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: viscosuite
      RABBITMQ_DEFAULT_PASS: viscosuite
    volumes:
      - ./demo-rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./demo-rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  viscorunner:
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      # RabbitMQ — AMQP event bus for integration events
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: viscosuite
      RABBITMQ_PASSWORD: viscosuite

      amqp.events.active: "true"

      # Keep the demo traffic generator's own runs out of Ladybug/journeys —
      # only the medical pipelines it feeds should appear as journeys.
      ibistesttool.regexFilter: "^(?!Pipeline demo-traffic/).*"

      # nl-core PROFILE validation: the mounted Nictiz packages (CC0) make the
      # intake validate against the nl-core profiles resources claim, not just
      # base R4. Run fhir-packages/download-packages.sh once after cloning.
      nlcore.validation.packages: /opt/frank/fhir-packages
      nlcore.validation.strict: "true"

      viscolink.views.names: viscoflow,lab-code-mapper,pipeline-console
      viscolink.views.lab-code-mapper.name: Lab Code Mapper
      viscolink.views.lab-code-mapper.url: /viscolink/demo-tools/loinc-mapping-ui.html
      viscolink.views.lab-code-mapper.description: Map local lab codes to LOINC
      viscolink.views.viscoflow.name: ViscoFlow
      viscolink.views.viscoflow.url: /viscolink/flow/
      viscolink.views.viscoflow.description: ViscoFlow — modular message flow viewer
      viscolink.views.pipeline-console.name: Demo Pipeline Tester
      viscolink.views.pipeline-console.url: /viscolink/demo-tools/test-client.html
      viscolink.views.pipeline-console.description: Drive demo pipelines end-to-end

      SPRING_CONFIG_ADDITIONAL_LOCATION: "optional:file:/app/overlay-config/"

      # Fake EMR — external PostgreSQL over TLS (k8s-hosted, public endpoint)
      FAKE_EMR_JDBC_DRIVER: org.postgresql.Driver
      FAKE_EMR_JDBC_URL: "jdbc:postgresql://fake-emr.k8s.viscosiety.com:5433/fake_emr?sslmode=require"
      FAKE_EMR_JDBC_USERNAME: emr_user
      FAKE_EMR_JDBC_PASSWORD: emr_lokaal_2024
      # credentials used by viscostore
      VISCOSTORE_USERNAME: demo
      VISCOSTORE_PASSWORD: demo

    volumes:
      - ./fhir-packages:/opt/frank/fhir-packages:ro
      # Demo Credentials
      - ./demo-secrets/credentials.properties:/opt/frank/secrets/credentials.properties:ro
      # Shadow the base configurations mount with the demo reference implementation.
      # Docker applies bind mounts in order; this entry (being last) wins for
      # /opt/frank/configurations, giving F!F the demo configurations to auto-discover.
      - ./demo-configurations:/opt/frank/configurations
      # Replace the base Tomcat context with the demo context, which adds the fake-emr JNDI datasource.
      - ./demo-conf/context.xml:/usr/local/tomcat/conf/context.xml:ro
      # Demo tool UIs — served under /viscolink/demo-tools/ via the webapp-overlay mechanism.
      # Mounted as a directory so new tools in demo-tools/ are served automatically.
      # (Not mounted into webapps/viscolink/ directly — that would cause Tomcat to pre-create
      # the directory, skip WAR extraction, and deploy an empty context in ~6 ms.)
      - ./demo-tools:/opt/frank/webapp-overlay/viscolink/demo-tools:ro
      - ./demo-resources/resources.yml:/opt/frank/resources/resources.yml:ro
      - ./demo-resources/loinc-mapping.csv:/opt/frank/resources/loinc-mapping.csv:ro
      - ./demo-hapi-overlay/application.yaml:/app/overlay-config/application.yaml:ro
      - hsearch-data:/data
volumes:
  hsearch-data: