amqp:
  - name: "viscosuite"
    url: "amqp://${RABBITMQ_HOST}:5672"
    username: "${RABBITMQ_USERNAME}"
    password: "${RABBITMQ_PASSWORD}"

mllp:
  - name: "inbound-2575"
    url: "mllp://0.0.0.0:2575"
    properties:
      charset: "UTF-8"
      backlog: "10"
      socketTimeout: "60000"

